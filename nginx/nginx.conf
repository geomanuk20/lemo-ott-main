# ==============================================================================
# Nginx Load Balancer & Reverse Proxy Configuration
# Project: LEMO OTT Platform Enterprise Stack
# Features: Multi-Node Load Balancing (Node #1..#4), Health Checks, HLS Caching
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Format with Response Time and Upstream Target
    log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time" '
                        'upstream=$upstream_addr';

    access_log /var/log/nginx/access.log main_ext;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.apple.mpegurl;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # ==============================================================================
    # 🔄 UPSTREAM LOAD BALANCER POOL (Node #1, Node #2, Node #3, Node #4)
    # ==============================================================================
    upstream backend_nodes {
        least_conn; # Distribute traffic to node with fewest active connections

        # Node #1 (8GB)
        server 127.0.0.1:5001 max_fails=3 fail_timeout=10s weight=1;
        # Node #2 (8GB)
        server 127.0.0.1:5002 max_fails=3 fail_timeout=10s weight=1;
        # Node #3 (8GB)
        server 127.0.0.1:5003 max_fails=3 fail_timeout=10s weight=1;
        # Node #4 (8GB)
        server 127.0.0.1:5004 max_fails=3 fail_timeout=10s weight=1;

        keepalive 64; # Keep-alive connection pool to backends
    }

    # Primary Server Block (Port 80 HTTP / Reverse Proxy)
    server {
        listen 80;
        listen [::]:80;
        server_name localhost lemoott.com www.lemoott.com;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "origin-when-cross-origin" always;

        # ----------------------------------------------------------------------
        # 1. Health Check Endpoint (Direct LB target check bypasses rate limits)
        # ----------------------------------------------------------------------
        location /health {
            proxy_pass http://backend_nodes/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # ----------------------------------------------------------------------
        # 2. REST API Traffic (Distributed across Node #1..#4)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn addr_limit 50;

            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for video processing / large payloads
            proxy_connect_timeout 15s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ----------------------------------------------------------------------
        # 3. HLS Live & VOD Video Segments (.m3u8 playlists and .ts chunks)
        # ----------------------------------------------------------------------
        location /hls/ {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Anti-Download & Inline Streaming Headers
            add_header Content-Disposition "inline" always;
            add_header X-Content-Type-Options "nosniff" always;
            expires 1d;
            add_header Cache-Control "public, no-transform";
            add_header Access-Control-Allow-Origin "*";
        }

        location /uploads/ {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Anti-Download & Inline Streaming Headers
            add_header Content-Disposition "inline" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ----------------------------------------------------------------------
        # 4. WebSockets / Live Stream Chat Upgrade
        # ----------------------------------------------------------------------
        location /socket.io/ {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ----------------------------------------------------------------------
        # 5. Default Fallback
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
